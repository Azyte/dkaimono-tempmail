<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background with Rounded Squircle Shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />

  <!-- Futuristic Mail Envelope Body -->
  <g transform="translate(96, 128)">
    <!-- Envelope Base Card -->
    <rect x="0" y="32" width="320" height="208" rx="28" fill="#1e1b4b" stroke="url(#primaryGrad)" stroke-width="8" />

    <!-- Lightning Bolt / Speed Flash Indicator -->
    <path d="M160 70 L140 135 L175 135 L150 205 L200 120 L165 120 Z" fill="url(#accentGrad)" filter="url(#glow)" />

    <!-- Envelope Top Flap (Cyber V-Fold) -->
    <path d="M12 40 L160 148 L308 40" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Fast Wings / Speed Lines -->
    <path d="M-30 80 L-10 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M-45 120 L-10 120" stroke="#818cf8" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    <path d="M-25 160 L-10 160" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.7" />

    <path d="M330 80 L350 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M330 120 L365 120" stroke="#818cf8" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    <path d="M330 160 L345 160" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Live Pulse Dot at top right -->
  <circle cx="380" cy="130" r="14" fill="#22c55e" filter="url(#glow)" />
  <circle cx="380" cy="130" r="22" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.6" />
</svg>
